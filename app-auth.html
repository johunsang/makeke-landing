<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>마케케 로그인</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, #fff8ef 0%, #f5f5f7 100%);
    color: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  .card {
    width: min(420px, 100%);
    padding: 42px 34px;
    border: 1px solid rgba(255,140,0,0.16);
    border-radius: 24px;
    background: rgba(255,255,255,0.94);
    box-shadow: 0 18px 48px rgba(0,0,0,0.08);
    text-align: center;
  }
  .logo { font-size: 32px; font-weight: 900; color: #ff8c00; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: rgba(0,0,0,0.5); margin-bottom: 28px; line-height: 1.55; }
  .btn {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-height: 50px;
    padding: 14px 22px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #ff8c00, #ff6b00);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 12px 26px rgba(255,107,0,0.22);
  }
  .btn:disabled { opacity: 0.7; cursor: wait; }
  .status {
    margin-top: 18px;
    padding: 13px 14px;
    border-radius: 14px;
    background: rgba(255,140,0,0.07);
    color: #b55300;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
  }
  .hint { margin-top: 14px; font-size: 12px; color: rgba(0,0,0,0.38); line-height: 1.5; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">마케케</div>
    <div class="subtitle">Google 로그인으로 마케케 계정을 연결합니다.</div>
    <a class="btn" id="loginBtn" href="https://makeke.kr/api/auth/login-url?port=8818&app=1">Google 계정으로 로그인</a>
    <div class="status" id="status">버튼을 누르면 Google 로그인 화면으로 이동합니다.</div>
    <div class="hint">로그인 후 앱으로 자동 연결됩니다. 연결이 늦으면 앱 화면으로 돌아가 잠시 기다려주세요.</div>
  </main>

<script>
function getRequestedPort() {
  return new URLSearchParams(window.location.search).get("port") || "8818";
}

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function getSessionId() {
  return new URLSearchParams(window.location.search).get("session_id") || `app-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function startLogin() {
  const btn = document.getElementById("loginBtn");
  btn.setAttribute("aria-disabled", "true");
  btn.textContent = "Google 로그인으로 이동 중...";
  setStatus("Google 로그인 화면으로 이동합니다.");
  const port = encodeURIComponent(getRequestedPort());
  const sessionId = encodeURIComponent(getSessionId());
  window.location.href = `https://makeke.kr/api/auth/login-url?session_id=${sessionId}&port=${port}&app=1`;
}

const loginBtn = document.getElementById("loginBtn");
loginBtn.href = `https://makeke.kr/api/auth/login-url?port=${encodeURIComponent(getRequestedPort())}&app=1`;
loginBtn.onclick = function(event) {
  event.preventDefault();
  startLogin();
};
</script>
</body>
</html>
